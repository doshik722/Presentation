# Здесь записываем, какими моделями и по какой версии промпта составлены тезисы (key_points) для награды и оценки.
# Ответы сохраняются без правок: <модель>/<пакет>_answer.json на <модель>/<пакет>.txt; исправления — <пакет>_fix.json.
models:
  claude: Claude Opus 5.5, высокий уровень рассуждений, веб-поиск
  codex: Codex Sol 6.1, веб-поиск; с train03 в правилах — конкретные statement и key с числами, без ссылок
  gemini: Gemini 3.1 Pro Preview без инструмента форматирования JSON, веб-поиск; с train02 и test02 в темах без числа слайдов — «не указано, считай 10–12»
prompt: ../key_points_prompt.txt  # версия 23.10.2026 (третья): title + statement + key (5–7, уровень учебника, год числом), о теме, а не о презентации; заключение; запрос пользователя. test01_answer_v1 — ответы по первой версии (test01 составляется заново по третьей); validation01_answer — по второй, приводится к текущим правилам вручную при проверке. Промпт с третьей версии не меняется
tasks: >
  359 заданий: train 274, validation 25, test 60. Темы делятся между моделями поровну, случайно (seed 2026),
  стратифицированно по выборке и типу темы; у темы один составитель. Пакеты по 9–10 тем, выборки не смешиваются.
  У заданий не из рабочих программ в строке темы есть «запрос» — полный текст пользователя. Источники — только
  в пакетах validation и test (для ручной проверки).
assignment: assignment.json
