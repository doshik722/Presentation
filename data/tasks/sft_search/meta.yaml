# Здесь записываем, какими моделями и по какой версии промпта составлены примеры SFT с поиском.
# Ответы сохраняются без правок: <модель>/answerN.txt на <модель>/batchN.txt; исправления — answerN_fix.txt.
models:
  claude: Claude Opus 5.5, высокий уровень рассуждений, веб-поиск
  codex: Codex Sol 6.1, веб-поиск
  gemini: Gemini 3.1 Pro Preview без инструмента форматирования JSON, веб-поиск
prompt: sft_search_prompt.txt  # версия 1, 22.10.2026
tasks: >
  48 заданий выборки SFT (из запросов WildChat и рабочих программ, без составленных), по 24 технических
  и гуманитарных, случайно (seed 2026); у каждого задания другой составитель, чем у примера без поиска на то же
  задание; поровну по моделям (16) и типам тем (8 и 8). «Поиск: есть»; «Картинки» — как у примера без поиска
  (offline.json). Пакеты по 2–3 задания: эпизод с выдачей длинный.
assignment: assignment.json
